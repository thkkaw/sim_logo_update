[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:php-fpm]
command=php-fpm -F
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=false
startretries=0

[program:laravel-cron]
process_name=%(program_name)s_%(process_num)02d
directory=/var/www/
command=php artisan schedule:work
autostart=true
autorestart=true
user=appown
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/storage/logs/laravel-cron.out.log
stopwaitsecs=60


