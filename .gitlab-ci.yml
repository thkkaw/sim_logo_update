stages:
  - build-sonar
    #  - build
  - deploy

image: 
  name: sonarsource/sonar-scanner-cli:11
  entrypoint: [""]

variables:
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"  # Defines the location of the analysis task cache
  GIT_DEPTH: "0"  # Tells git to fetch all the branches of the project, required by the analysis task

stages:
  - build-sonar


build-sonar:
  stage: build-sonar

  
  
  cache:
    policy: pull-push
    key: "sonar-cache-$CI_COMMIT_REF_SLUG"
    paths:
      - "${SONAR_USER_HOME}/cache"
      - sonar-scanner/
      
  script: 
  - sonar-scanner -Dsonar.host.url="${SONAR_HOST_URL}"
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == 'staging'
    - if: $CI_COMMIT_BRANCH == 'main'
    - if: $CI_COMMIT_BRANCH == 'develop'

  tag:
    - sonar-runner  

deploy_staging:
  stage: deploy
  before_script:
    - cd /data/apps/sim-logo-update
  script:
    - sudo -u appown -H sh -c 'cd /data/apps/sim-logo-update && git pull staging'
   # - docker exec sourcing_portal php artisan migrate
   # - docker exec sourcing_portal php artisan users:permissions
   # - docker exec sourcing_portal php artisan setup:data
          # - git config --global --add safe.directory /data/sourcing/sourcing-portal
          # - git pull
          #- php artisan migrate
    - echo "deployed"
  tags:
    - staging-laravel
  only:
    - staging
  when: always  
